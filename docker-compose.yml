services:
  postgres:
    image: postgres:17
    container_name: worksphere-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: worksphere
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgresql1q2w3e4r

    ports:
      - "5433:5432"

    volumes:
      - worksphere_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d worksphere"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  worksphere_postgres_data: