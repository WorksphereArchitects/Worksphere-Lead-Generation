
name: Process Annual Report

run-name: Process annual report ${{ inputs.report_id }}

on:
  workflow_dispatch:
    inputs:
      report_id:
        description: "Supabase annual report UUID"
        required: true
        type: string

# Only one annual report workflow runs at a time.
# Additional reports wait in the queue.
concurrency:
  group: worksphere-annual-report-processing
  queue: max

permissions:
  contents: read

jobs:
  process-report:
    name: Process Annual Report
    runs-on: ubuntu-latest
    env:
      FR_API_KEY: ${{ secrets.FR_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Process annual report
        working-directory: backend
        env:
          PYTHONPATH: backend

          REPORT_ID: ${{ inputs.report_id }}

          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          # Add other backend environment variables here.
        run: |
          python -m scripts.process_annual_report
